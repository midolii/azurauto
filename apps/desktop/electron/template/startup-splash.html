<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(720px 420px at 18% 12%, rgba(147, 216, 255, 0.38), transparent 62%),
          radial-gradient(680px 420px at 84% 8%, rgba(255, 226, 236, 0.48), transparent 64%),
          linear-gradient(180deg, #fbfdff 0%, #f2f8ff 52%, #edf7f3 100%);
        color: #173a40;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }
      .mark {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #38b7c6;
        box-shadow: 0 0 28px rgba(56, 183, 198, 0.42);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .brand {
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #328f97;
        font-weight: 700;
      }
      .text {
        font-size: 18px;
        font-weight: 650;
        color: #173a40;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" role="status" aria-live="polite" aria-busy="true">
      <div class="mark" aria-hidden="true"></div>
      <div class="brand">AzurAuto</div>
      <div class="text">正在启动</div>
    </main>
  </body>
</html>
