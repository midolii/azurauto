<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #020617;
        color: #e2e8f0;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }
      .mark {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #a5f3fc;
        box-shadow: 0 0 28px rgba(165, 243, 252, 0.65);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .brand {
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #a5f3fc;
        font-weight: 700;
      }
      .text {
        font-size: 18px;
        font-weight: 650;
        color: #f8fafc;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" role="status" aria-live="polite" aria-busy="true">
      <div class="mark" aria-hidden="true"></div>
      <div class="brand">AzurAuto</div>
      <div class="text">正在启动</div>
    </main>
  </body>
</html>
