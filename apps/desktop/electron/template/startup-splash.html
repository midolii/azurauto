<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --radius-panel: 12px;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(780px 460px at 14% 10%, rgba(14, 165, 233, 0.18), transparent 62%),
          radial-gradient(720px 440px at 88% 6%, rgba(16, 185, 129, 0.14), transparent 64%),
          linear-gradient(180deg, #f8fbff 0%, #eef6ff 54%, #f8fafc 100%);
        color: #0f172a;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .splash {
        width: min(420px, calc(100% - 48px));
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: rgba(255, 255, 255, 0.82);
        border-radius: var(--radius-panel);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        padding: 34px 32px;
        text-align: center;
        backdrop-filter: blur(16px);
      }

      .mark {
        width: 12px;
        height: 12px;
        margin: 0 auto 22px;
        border-radius: 999px;
        background: #0284c7;
        box-shadow: 0 0 28px rgba(2, 132, 199, 0.3);
        animation: pulse 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .brand {
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #0369a1;
        font-weight: 700;
      }

      .text {
        margin-top: 16px;
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
      }

      .hint {
        margin-top: 10px;
        color: #475569;
        font-size: 14px;
        line-height: 1.7;
      }

      @keyframes pulse {
        50% {
          opacity: 0.45;
          transform: scale(0.88);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" role="status" aria-live="polite" aria-busy="true">
      <div class="mark" aria-hidden="true"></div>
      <div class="brand">AzurAuto</div>
      <div class="text">正在启动控制台</div>
      <div class="hint">正在加载 renderer。启动阶段不会自动连接 ADB 设备。</div>
    </main>
  </body>
</html>
